<style>
/* ===== دکمهٔ شناور «اپ» — بلوک HTML/CSS برای افزونه Ad Inserter =====
   یک آیکون پریمیوم به شکل آیکون واقعی اپ: بدنهٔ مربعِ گرد با گرادیان سرمه‌ایِ برند،
   براقیت شیشه‌ای، نشان گوشی + APP، و نقطهٔ قرمز هشدار. حس «دکمهٔ نصب اپ».
   بدون جاوااسکریپت. انتخابگرها با .amx-appbtn شروع می‌شوند. */
.amx-appbtn{position:fixed;left:22px;bottom:22px;z-index:99999;display:block;width:62px;height:62px;border-radius:17px;
  background:linear-gradient(155deg,#3d5866 0%,#2b4350 45%,#16242c 100%);
  box-shadow:0 10px 24px rgba(20,30,38,.4),0 3px 8px rgba(20,30,38,.28),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 6px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.08);
  transition:transform .2s ease,box-shadow .2s ease}
.amx-appbtn:hover,.amx-appbtn:focus-visible{transform:translateY(-2px);box-shadow:0 16px 32px rgba(20,30,38,.46),0 4px 10px rgba(20,30,38,.3),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 6px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.1)}
.amx-appbtn:focus-visible{outline:3px solid rgba(192,95,95,.6);outline-offset:4px}
.amx-appbtn svg{display:block;width:100%;height:100%;border-radius:17px}
/* نقطهٔ نوتیفیکیشن قرمز */
.amx-appbtn i{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:#c05f5f;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
@media(max-width:640px){.amx-appbtn{left:14px;bottom:14px;width:54px;height:54px;border-radius:15px}.amx-appbtn svg,.amx-appbtn svg{border-radius:15px}}
</style>

<a class="amx-appbtn" href="https://app-alummetal.ir/" target="_blank" rel="noopener" aria-label="اپلیکیشن آلوم متال" title="اپلیکیشن آلوم متال — رایگان روی گوشی نصب کنید">
  <svg viewBox="0 0 62 62" role="img" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="amx-gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
        <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="amx-clip"><rect x="0" y="0" width="62" height="62" rx="17" ry="17"/></clipPath>
    </defs>
    <g clip-path="url(#amx-clip)">
      <!-- براقیت شیشه‌ای بالای آیکون -->
      <rect x="0" y="0" width="62" height="34" fill="url(#amx-gloss)"/>
      <!-- نشان گوشی + APP -->
      <g fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" opacity=".96">
        <rect x="19" y="12" width="24" height="39" rx="6"/>
        <line x1="26.5" y1="17.5" x2="35.5" y2="17.5"/>
      </g>
      <text x="31" y="32" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.6" font-weight="700" fill="#ef7a7a">APP</text>
      <line x1="25.5" y1="37.5" x2="36.5" y2="37.5" stroke="#ef7a7a" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="31" cy="45.5" r="2.3" fill="none" stroke="#ffffff" stroke-width="1.8" opacity=".85"/>
    </g>
  </svg>
  <i aria-hidden="true"></i>
</a>
