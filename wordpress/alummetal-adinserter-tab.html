<style>
/* ===== لوگوی شناور اپ آلوم متال — بلوک HTML/CSS برای افزونه Ad Inserter =====
   فقط یک لوگوی دایره‌ای گوشهٔ پایین-چپ سایت با انیمیشن؛ بدون جاوااسکریپت.
   همهٔ انتخابگرها با .amx-fab شروع می‌شوند تا با استایل قالب تداخل نکنند. */
.amx-fab{position:fixed;left:22px;bottom:22px;z-index:99999;display:block;width:58px;height:58px;border-radius:50%;opacity:1;animation:amx-fab-in .55s cubic-bezier(.2,.9,.3,1.25) .25s backwards;transition:transform .25s ease}
.amx-fab:hover,.amx-fab:focus-visible{transform:scale(1.09)}
.amx-fab:focus-visible{outline:3px solid rgba(192,95,95,.65);outline-offset:4px}
.amx-fab img{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 6px 18px rgba(20,30,38,.42),0 0 0 2px #fff,0 0 0 3.5px rgba(52,70,82,.16)}
/* حلقهٔ چرخان دور لوگو */
.amx-fab:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,rgba(192,95,95,0) 0deg,rgba(192,95,95,0) 240deg,rgba(192,95,95,.95) 300deg,rgba(255,210,210,.95) 335deg,rgba(192,95,95,0) 360deg);-webkit-mask:radial-gradient(farthest-side,rgba(0,0,0,0) calc(100% - 3.5px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,rgba(0,0,0,0) calc(100% - 3.5px),#000 calc(100% - 3.5px));animation:amx-fab-spin 3.4s linear infinite}
/* نبض ملایم نورانی */
.amx-fab:after{content:"";position:absolute;inset:0;border-radius:50%;animation:amx-fab-pulse 2.8s ease-out infinite}
.amx-fab:hover:before{animation-duration:1.2s}
@supports not ((-webkit-mask:radial-gradient(#000,#000)) or (mask:radial-gradient(#000,#000))){.amx-fab:before{display:none}}
@keyframes amx-fab-in{from{opacity:0;transform:translateY(20px) scale(.6)}to{opacity:1;transform:none}}
@keyframes amx-fab-spin{to{transform:rotate(360deg)}}
@keyframes amx-fab-pulse{0%{box-shadow:0 0 0 0 rgba(192,95,95,.42)}70%{box-shadow:0 0 0 13px rgba(192,95,95,0)}100%{box-shadow:0 0 0 0 rgba(192,95,95,0)}}
@media (prefers-reduced-motion:reduce){
  .amx-fab{animation:none}
  .amx-fab:before,.amx-fab:after{animation:none}
}
@media(max-width:640px){
  .amx-fab{left:14px;bottom:14px;width:50px;height:50px}
}
</style>
