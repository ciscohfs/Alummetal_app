<style>
/* ===== لوگوی شناور «اپ» آلوم متال — بلوک HTML/CSS برای افزونه Ad Inserter =====
   فقط یک آیکونِ شکل‌دار گوشهٔ پایین-چپ سایت: بدنهٔ گوشی با نشان آلوم متال وسطش
   تا با یک نگاه معلوم باشد «برنامهٔ موبایل» است، نه لوگوی سایت.
   بدون جاوااسکریپت. همهٔ انتخابگرها با .amx-fab شروع می‌شوند. */
.amx-fab{position:fixed;left:22px;bottom:22px;z-index:99999;display:block;width:60px;height:60px;opacity:1;animation:amx-fab-in .55s cubic-bezier(.2,.9,.3,1.25) .25s backwards;transition:transform .25s ease}
.amx-fab:hover,.amx-fab:focus-visible{transform:scale(1.09)}
.amx-fab:focus-visible{outline:3px solid rgba(192,95,95,.65);outline-offset:4px}
.amx-fab svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 16px rgba(20,30,38,.4))}
/* حلقهٔ چرخان دور آیکون */
.amx-fab:before{content:"";position:absolute;inset:-6px;border-radius:20px;background:conic-gradient(from 0deg,rgba(192,95,95,0) 0deg,rgba(192,95,95,0) 240deg,rgba(192,95,95,.95) 300deg,rgba(255,210,210,.95) 335deg,rgba(192,95,95,0) 360deg);-webkit-mask:radial-gradient(farthest-side,rgba(0,0,0,0) calc(100% - 3.5px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,rgba(0,0,0,0) calc(100% - 3.5px),#000 calc(100% - 3.5px));animation:amx-fab-spin 3.4s linear infinite}
/* نبض ملایم نورانی */
.amx-fab:after{content:"";position:absolute;inset:0;border-radius:20px;animation:amx-fab-pulse 2.8s ease-out infinite}
.amx-fab:hover:before{animation-duration:1.2s}
@supports not ((-webkit-mask:radial-gradient(#000,#000)) or (mask:radial-gradient(#000,#000))){.amx-fab:before{display:none}}
@keyframes amx-fab-in{from{opacity:0;transform:translateY(20px) scale(.6)}to{opacity:1;transform:none}}
@keyframes amx-fab-spin{to{transform:rotate(360deg)}}
@keyframes amx-fab-pulse{0%{box-shadow:0 0 0 0 rgba(192,95,95,.42)}70%{box-shadow:0 0 0 13px rgba(192,95,95,0)}100%{box-shadow:0 0 0 0 rgba(192,95,95,0)}}
@media (prefers-reduced-motion:reduce){
  .amx-fab,.amx-fab:before,.amx-fab:after{animation:none}
}
@media(max-width:640px){
  .amx-fab{left:14px;bottom:14px;width:52px;height:52px}
}
</style>

<a class="amx-fab" href="https://app-alummetal.ir/" target="_blank" rel="noopener" aria-label="اپلیکیشن آلوم متال — نصب رایگان" title="اپلیکیشن آلوم متال — رایگان روی گوشی نصب کنید">
  <svg viewBox="0 0 64 64" role="img" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="amx-fab-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#33505f"/>
        <stop offset="1" stop-color="#16232c"/>
      </linearGradient>
      <clipPath id="amx-fab-clip"><rect x="4" y="2" width="56" height="60" rx="14" ry="14"/></clipPath>
    </defs>
    <!-- بدنهٔ گوشی -->
    <rect x="4" y="2" width="56" height="60" rx="14" ry="14" fill="url(#amx-fab-bg)"/>
    <g clip-path="url(#amx-fab-clip)">
      <!-- صفحهٔ روشن داخل گوشی -->
      <rect x="9" y="9" width="46" height="46" rx="8" fill="#eef4f6"/>
      <!-- نشان کوه/آب آلوم متال (ساده‌شده) -->
      <path d="M18 40 L27 24 L33 34 L37 28 L46 40 Z" fill="#d8402f"/>
      <path d="M16 43 q10 -6 18 -1 q8 5 16 -2 q-8 8 -18 3 q-8 -3 -16 0 Z" fill="#2f86c7"/>
    </g>
    <!-- بلندگوی بالای گوشی -->
    <rect x="26" y="5.5" width="12" height="2.4" rx="1.2" fill="rgba(255,255,255,.55)"/>
    <!-- نشان «خانه / نصب روی صفحهٔ اصلی» -->
    <g transform="translate(45,44)">
      <circle cx="9" cy="9" r="10.5" fill="#c05f5f" stroke="#ffffff" stroke-width="2.4"/>
      <path d="M9 4.4 L13.6 8.6 L13.6 14 L4.4 14 L4.4 8.6 Z" fill="#ffffff"/>
    </g>
  </svg>
</a>
