<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پاک‌سازی نسخه قدیمی</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07121b;color:#eaf7f8;font-family:Tahoma,sans-serif}.box{width:min(420px,calc(100% - 40px));padding:28px;border:1px solid #34515d;border-radius:22px;background:#102832;text-align:center}p{color:#a9c0c6;line-height:2}strong{color:#ffad68}</style>
</head>
<body>
  <main class="box"><strong>در حال پاک‌سازی نسخهٔ قدیمی...</strong><p id="status">کش و Service Worker قبلی حذف می‌شوند.</p></main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        status.textContent = 'پاک‌سازی انجام شد؛ در حال بازکردن نسخهٔ جدید...';
      } catch (error) {
        status.textContent = 'پاک‌سازی انجام شد؛ در حال بازکردن برنامه...';
      }
      setTimeout(() => { location.replace('./index.html'); }, 350);
    })();
  </script>
</body>
</html>
